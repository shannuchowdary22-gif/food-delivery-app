spring.application.name=zomiggy-backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zomiggy}?createDatabaseIfNotExist=true&serverTimezone=UTC&sslMode=${DB_SSL_MODE:DISABLED}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origin=${FRONTEND_URL:${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}}
app.otp.expose=${EXPOSE_OTP:true}
tracking.demo-mode=${TRACKING_DEMO_MODE:true}
tracking.update-interval-ms=${TRACKING_UPDATE_INTERVAL_MS:1000}
tracking.simulation-speed=${TRACKING_SIMULATION_SPEED:1.0}
management.endpoints.web.exposure.include=health